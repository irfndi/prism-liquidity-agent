name: Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

# Security: keep the secret out of job-level env so it is only exposed
# to steps that need it. The boolean flag gates the `if:` checks below.
env:
  HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
  # Single source of truth for the Bun version; every setup-bun step below
  # references it. The repository's bunfig.toml enables Bun 1.4's isolated
  # linker and shared global store. (Cloudflare R2 is deprecated for
  # distribution — account billing; releases publish to GitHub only.)
  BUN_VERSION: 1.4.2

permissions:
  contents: write

jobs:
  version-guard:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify package.json version matches tag
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($GITHUB_REF_NAME). Bump package.json before tagging."
            exit 1
          fi
          echo "→ package.json version matches tag: ${VERSION}"

  test:
    needs: version-guard
    runs-on: ubuntu-latest
    # Split the engine test suite across parallel shards (Vitest --shard).
    # Each shard runs a disjoint subset of bench/**/*.test.ts; the whole suite
    # is only "green" when every shard passes. Run on the canary Bun runtime
    # so the engine tests exercise the same runtime that ships with the agent.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Run lint
        run: bun run lint

      - name: Run tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: bun run test -- --shard=${{ matrix.shard }}/${{ matrix.total }}

  build-bundles:
    needs: [version-guard, test]
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-key: linux-x64
          - os: ubuntu-24.04-arm
            platform-key: linux-arm64
          - os: macos-15-intel
            platform-key: darwin-x64
          - os: macos-latest
            platform-key: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Build bundle
        run: bun run scripts/build-bundle.ts

      - name: Build prismd release binary (linux-x64 deploy target)
        if: matrix.platform-key == 'linux-x64'
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable build --release --manifest-path native/rust/Cargo.toml
          cp native/rust/target/release/prismd ./prismd-linux-x64
          sha256sum ./prismd-linux-x64 > ./prismd-linux-x64.sha256
          cat ./prismd-linux-x64.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.platform-key }}
          path: |
            prism-v*.tar.gz
            prism-v*.tar.gz.sha256
            prismd-linux-x64
            prismd-linux-x64.sha256
          if-no-files-found: error

  release:
    needs: [version-guard, test, build-bundles]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version-guard.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set CHANNEL
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta* ]]; then
            echo "CHANNEL=beta" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" == *-dev* ]]; then
            echo "CHANNEL=dev" >> "$GITHUB_ENV"
          elif [[ "${GITHUB_REF_NAME}" != v*.*.* ]]; then
            echo "::error::unsupported prerelease tag '${GITHUB_REF_NAME}'; use vX.Y.Z-beta.N or vX.Y.Z-dev.N"
            exit 1
          else
            echo "CHANNEL=stable" >> "$GITHUB_ENV"
          fi
          echo "→ VERSION=${VERSION} CHANNEL=${CHANNEL}"

      - name: Sync package.json version
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"
          echo "→ package.json version set to ${VERSION}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Download bundle artifacts
        uses: actions/download-artifact@v8
        with:
          path: bundles
          pattern: bundle-*
          merge-multiple: false

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Build source tarball
        run: |
          TARBALL_NAME="prism-v${VERSION}.tar.gz"
          echo "Building ${TARBALL_NAME}"
          mkdir -p /tmp/prism-release
          tar -czf "/tmp/prism-release/${TARBALL_NAME}" \
            --warning=no-file-changed \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=bundles \
            --exclude=engine/sqlite-vec-embedded.ts \
            --exclude=.git \
            --exclude=*.db \
            --exclude=*.db-journal \
            --exclude=*.db-wal \
            --exclude=*.db-shm \
            --exclude=logs \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=bench/tmp-audit \
            --exclude=.wrangler \
            --exclude=cloudflare/.wrangler \
            --exclude=.omo \
            --exclude=.rtk \
            --exclude=.opencode \
            .
          cp "/tmp/prism-release/${TARBALL_NAME}" "./${TARBALL_NAME}"
          ls -lh "${TARBALL_NAME}"

      - name: Generate SHA-256 for source tarball
        run: |
          TARBALL_NAME="prism-v${VERSION}.tar.gz"
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"
          cat "${TARBALL_NAME}.sha256"

      - name: Collect release assets
        run: |
          mkdir -p release-assets
          cp "prism-v${VERSION}.tar.gz" release-assets/
          cp "prism-v${VERSION}.tar.gz.sha256" release-assets/
          for dir in bundles/bundle-*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/*.tar.gz release-assets/ 2>/dev/null || true
              cp "$dir"/*.tar.gz.sha256 release-assets/ 2>/dev/null || true
              # prismd native host (linux-x64 only): version + checksum alongside bundles.
              if [ -f "$dir/prismd-linux-x64" ]; then
                cp "$dir/prismd-linux-x64" "release-assets/prismd-${VERSION}-linux-x64"
                cp "$dir/prismd-linux-x64.sha256" "release-assets/prismd-${VERSION}-linux-x64.sha256" 2>/dev/null || true
              fi
            fi
          done

      - name: Verify release bundles are complete
        # Channel manifests went with R2 (deprecated for distribution — account
        # billing); the updater reads GitHub Release assets directly, so gate
        # on the files themselves. The explicit platform suffix keeps a
        # prerelease source tarball (prism-v1.2.3-beta.1.tar.gz) from counting.
        run: |
          BUNDLE_COUNT=$(ls release-assets/ | grep -cE '^prism-v[0-9].*-(linux|darwin)-(x64|arm64)\.tar\.gz$' || true)
          if [ "$BUNDLE_COUNT" -lt 4 ]; then
            echo "::error::release-assets has ${BUNDLE_COUNT} platform bundles; expected 4"
            ls release-assets/
            exit 1
          fi
          echo "✓ release-assets has ${BUNDLE_COUNT} platform bundles"

      - name: Sign tarball and bundles (GPG, optional)
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import
          for f in "release-assets/prism-v${VERSION}.tar.gz" "release-assets/prism-v${VERSION}"-*.tar.gz; do
            [ -e "$f" ] || continue
            gpg --batch --yes --armor --detach-sign "$f"
          done

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes \
              --verify-tag \
              release-assets/*
          fi
