name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Read-only token: the build job needs no write scope (checkout uses
# persist-credentials: false below), and a compromised step must not be able
# to push or mutate releases.
permissions:
  contents: read

# Single source of truth for the Bun version; every setup-bun step below
# references it. The repository's bunfig.toml enables Bun 1.4's isolated
# linker and shared global store. (Cloudflare R2 is deprecated for
# distribution — account billing; releases publish to GitHub.)
env:
  BUN_VERSION: 1.4.2

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true
      NODE_ENV: test
      ANTHROPIC_API_KEY: test-anthropic-key
      HELIUS_API_KEY: test-helius-key
      SOLANA_RPC_URL: https://example.com
      WALLET_PRIVATE_KEY: test-private-key
      LOG_LEVEL: error
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install

      - name: Generate embedded sqlite-vec extension
        run: bun run scripts/generate-vec-embed.ts linux x64

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

      # Smoke-test the shell wrapper (the package `bin` and primary user entry
      # point). `bash -n` catches quoting/unbound-variable regressions and the
      # version invocation proves it resolves bun and launches the CLI — the
      # wrapper was previously excluded from every lint/format/test gate. The
      # HOME-unset run executes the wrapper to prove the PATH-based bun lookup
      # works without a home directory (systemd units, cron, minimal images).
      - name: Smoke test scripts/prism.sh
        run: |
          bash -n scripts/prism.sh
          scripts/prism.sh --version
          env -u HOME PATH="$PATH" scripts/prism.sh --version

      # Compiled-binary gate: scripts/compile-binary.ts self-verifies every
      # build it produces (fails loud on the oven-sh/bun#42664 startup crash
      # instead of shipping a broken artifact). Runs on the linux-x64 runner
      # (the only target it can smoke-test); skips cleanly elsewhere. Needs
      # the CLI bundle first (tsdown.cli.config.ts) for the `prism` profile.
      - name: Smoke test compiled binaries (informational — bun#42664 open)
        continue-on-error: true
        run: |
          bunx --bun tsdown --config tsdown.cli.config.ts
          bun scripts/compile-binary.ts prism
          bun scripts/compile-binary.ts prismd

      # Coverage was local-only; this also enforces the istanbul thresholds
      # configured in vitest.config.ts so PRs can't silently regress them.
      - name: Run tests with coverage gate
        run: bun run coverage
  # Cloudflare worker suites (API route tests + Telegram bot) on
  # vitest-pool-workers, which simulates D1/KV/R2 locally — no Cloudflare
  # credentials needed. The root coverage gate only measures bench/** and
  # deploy-cloudflare.yml only typechecks, so without this job a regression in
  # the worker suites could pass every required check and reach the live
  # Workers. Deliberately standalone (no `needs: build`) and limited to the
  # cloudflare/ subproject so it stays green independent of engine changes.
  cloudflare-tests:
    if: false  # SUNSET (2026-09-18 rust-bend hybrid): Cloudflare compute undeployed — job gated off, not deleted.
    runs-on: ubuntu-latest
    # Split the worker suite across parallel shards (Vitest --shard). Each
    # shard runs a disjoint subset of the worker test files; the suite is only
    # green when every shard passes.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
        total: [4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install
        working-directory: cloudflare

      - name: Type check workers
        run: bun run typecheck
        working-directory: cloudflare

      - name: Run worker tests (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: bun --bun vitest run --shard=${{ matrix.shard }}/${{ matrix.total }}
        working-directory: cloudflare

  # Canary release channel: build + publish a per-merge canary bundle as the
  # rolling GitHub prerelease `canary` whenever CI passes on main. Mirrors
  # release.yml's bundle/manifest patterns; assets publish first and the
  # manifest.json upload lands last — that upload is the pointer flip. No GPG.
  canary-prepare:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # Role-scoped group: prepare and publish must not share a group, or an
    # older run's publish can cancel a newer run's prepare mid-flight and
    # publish the older commit. Same-role jobs still supersede each other.
    concurrency:
      group: canary-prepare
      cancel-in-progress: true
    outputs:
      canary_version: ${{ steps.meta.outputs.canary_version }}
      full_sha: ${{ steps.meta.outputs.full_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install

      - name: Compute canary version and build dir
        id: meta
        run: |
          NEXT=$(node -e "console.log(require('semver').inc(require('./package.json').version, 'patch'))")
          TS=$(date -u +%Y%m%dT%H%M%S)
          SHA8=$(git rev-parse --short=8 HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          # Embed the short SHA in the version so two pushes within the same
          # second cannot collide on one canary version string.
          echo "canary_version=${NEXT}-canary.${TS}-${SHA8}" >> "$GITHUB_OUTPUT"
          echo "full_sha=${FULL_SHA}" >> "$GITHUB_OUTPUT"

  canary-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, canary-prepare]
    # Per-platform group: a shared group with cancel-in-progress would make
    # matrix siblings cancel each other, so no run would produce all 4 bundles.
    concurrency:
      group: canary-publish-${{ matrix.platform-key }}
      cancel-in-progress: true
    env:
      VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform-key: linux-x64
          - os: ubuntu-24.04-arm
            platform-key: linux-arm64
          - os: macos-15-intel
            platform-key: darwin-x64
          - os: macos-latest
            platform-key: darwin-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install

      - name: Stamp package.json canary version
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"

      - name: Generate embedded sqlite-vec extension
        run: |
          PLATFORM_KEY="${{ matrix.platform-key }}"
          bun run scripts/generate-vec-embed.ts "${PLATFORM_KEY%%-*}" "${PLATFORM_KEY##*-}"

      - name: Build bundle
        run: bun run scripts/build-bundle.ts

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: canary-bundle-${{ matrix.platform-key }}
          path: |
            prism-v*.tar.gz
            prism-v*.tar.gz.sha256
          if-no-files-found: error

  canary-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, canary-prepare, canary-build]
    runs-on: ubuntu-latest
    # Rolling-canary publish writes the `canary` prerelease (gh release
    # delete/create/upload) — the only write this workflow performs now that
    # Cloudflare R2 is deprecated for distribution (account billing).
    permissions:
      contents: write
    concurrency:
      group: canary-publish
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install dependencies
        run: bun install

      - name: Download canary bundle artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: canary-bundle-*
          path: canary-assets

      - name: Flatten bundle artifacts
        run: |
          mkdir -p canary-assets
          for dir in canary-assets/canary-bundle-*/; do
            if [ -d "$dir" ]; then
              mv "$dir"prism-v* canary-assets/ 2>/dev/null || true
              rmdir "$dir" 2>/dev/null || true
            fi
          done
          ls -lh canary-assets/

      - name: Stamp package.json canary version
        env:
          VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
        run: |
          node -e "const fs=require('fs');const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));pkg.version=process.env.VERSION;fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');"

      - name: Build source tarball
        env:
          VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
        run: |
          TARBALL_NAME="prism-v${VERSION}.tar.gz"
          echo "Building ${TARBALL_NAME}"
          mkdir -p /tmp/prism-release
          tar -czf "/tmp/prism-release/${TARBALL_NAME}" \
            --warning=no-file-changed \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=canary-assets \
            --exclude=engine/sqlite-vec-embedded.ts \
            --exclude=.git \
            --exclude=*.db \
            --exclude=*.db-journal \
            --exclude=*.db-wal \
            --exclude=*.db-shm \
            --exclude=logs \
            --exclude=.env \
            --exclude=.env.* \
            --exclude=bench/tmp-audit \
            --exclude=.wrangler \
            --exclude=cloudflare/.wrangler \
            --exclude=.omo \
            --exclude=.rtk \
            --exclude=.opencode \
            .
          cp "/tmp/prism-release/${TARBALL_NAME}" "./${TARBALL_NAME}"
          sha256sum "${TARBALL_NAME}" > "${TARBALL_NAME}.sha256"
          mv "${TARBALL_NAME}" "${TARBALL_NAME}.sha256" canary-assets/
          ls -lh canary-assets/

      - name: Generate canary manifest (GitHub asset URLs)
        env:
          VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
          FULL_SHA: ${{ needs.canary-prepare.outputs.full_sha }}
          RELEASE_BASE_URL: https://github.com/${{ github.repository }}/releases/download
          RELEASE_KEY_PREFIX: canary
        run: |
          cd canary-assets
          VERSION="${VERSION}" CHANNEL=canary COMMIT="${FULL_SHA}" RELEASE_BASE_URL="${RELEASE_BASE_URL}" RELEASE_KEY_PREFIX="${RELEASE_KEY_PREFIX}" REQUIRE_ALL_BUNDLES=true bun run ../scripts/generate-release-manifest.ts
          cd ..
          BUNDLE_COUNT=$(jq '.bundles | length' canary-assets/manifest.json)
          if [ "$BUNDLE_COUNT" -lt 4 ]; then
            echo "::error::Manifest has only ${BUNDLE_COUNT} platform bundles; expected 4"
            jq '.bundles | keys' canary-assets/manifest.json
            exit 1
          fi
          echo "→ Manifest has ${BUNDLE_COUNT} platform bundles"
          cat canary-assets/manifest.json

      - name: Publish rolling canary GitHub prerelease (assets first)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
          FULL_SHA: ${{ needs.canary-prepare.outputs.full_sha }}
        run: |
          # Recreate the rolling tag from THIS commit so it can never point at
          # a stale SHA. Assets are uploaded WITHOUT manifest.json: a client
          # may see bundles before the manifest, never a manifest before its
          # bundles — the manifest upload below is the pointer flip.
          gh release delete canary --cleanup-tag --yes || true
          cd canary-assets
          assets=$(ls | grep -v '^manifest\.json$')
          gh release create canary \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "canary ${VERSION}" \
            --notes "Rolling main-branch canary build ${VERSION} (commit ${FULL_SHA}). manifest.json is uploaded last; its appearance is the publish flip." \
            ${assets}
          cd ..

      - name: Validate canary bundles are reachable (HEAD)
        # The pointer flip below publishes the manifest to every `prism update
        # --canary` client, so EVERY embedded bundle URL must be confirmed
        # reachable (HTTP 2xx) first — a dead upload must never be flipped live.
        run: |
          if ! count=$(jq -e '.bundles | length' canary-assets/manifest.json 2>/dev/null); then
            echo "::error::could not read bundle count from canary manifest"
            exit 1
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::canary manifest has no bundles"
            exit 1
          fi
          while IFS= read -r URL; do
            [ -z "$URL" ] && continue
            echo "→ HEAD ${URL}"
            curl -fsSI --max-time 30 "$URL" >/dev/null || { echo "::error::canary bundle unreachable: ${URL}"; exit 1; }
          done < <(jq -r '.bundles[].url' canary-assets/manifest.json)
          echo "→ OK: all ${count} canary bundles reachable"

      - name: Publish canary manifest (pointer flip)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload canary canary-assets/manifest.json --clobber

      - name: Canary summary
        env:
          CANARY_VERSION: ${{ needs.canary-prepare.outputs.canary_version }}
          FULL_SHA: ${{ needs.canary-prepare.outputs.full_sha }}
        run: |
          echo "Canary published: ${CANARY_VERSION} (commit ${FULL_SHA})"
          echo "Users can install with: prism update --canary"

  # Host-side Rust tests for native/rust (rusqlite-backed store) on the
  # stable toolchain. Standalone (no `needs:`) so a Rust regression fails CI
  # even when the TS engine is green. Inherits the top-level `on:` like the
  # engine jobs. Installs Bend too: the bend::clamp_fee_il subprocess-parity
  # tests in src/main.rs skip (not fail) without it, so installing here is
  # what turns them from a no-op into a real gate.
  rust-host:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Install Bend
        run: curl -fsSL https://bend-lang.com/install.sh | sh

      - name: Check formatting
        run: cargo +stable fmt --check --manifest-path native/rust/Cargo.toml

      - name: Run Rust tests
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          command -v bend
          cargo +stable test --manifest-path native/rust/Cargo.toml

  # prismd release binary: `cargo build --release` on linux-x64, uploaded as
  # a CI artifact (no release, no deploy). Proves the host compiles clean on
  # the deploy target every push and gives the box a known-good binary to
  # pull by hand — the deploy itself stays manual (soak guard binds).
  prismd-binary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install stable toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Rust cache (release rebuilds stay fast)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/rust

      - name: Check formatting
        run: cargo +stable fmt --check --manifest-path native/rust/Cargo.toml

      - name: Build prismd release
        run: cargo +stable build --release --manifest-path native/rust/Cargo.toml

      - name: Smoke test prismd (shadow tick, no keys)
        run: |
          SQLITE_DB_PATH=/tmp/prismd-ci-smoke.db SCAN_INTERVAL_MS=10000 BEND_BIN=false ./native/rust/target/release/prismd --ticks 1 2>&1 | tee /tmp/prismd-smoke.out
          grep -q "tick=1.*exit_free=true" /tmp/prismd-smoke.out

      - name: Upload prismd binary
        uses: actions/upload-artifact@v7
        with:
          name: prismd-linux-x64
          path: native/rust/target/release/prismd
          if-no-files-found: error

  # Bend proof gate: `bend native/bend/PROOF.bend` fails while any law is open
  # or false. Runs from the repo root (imports resolve relative to it) and
  # asserts the 300n ceiling pin. BEND_NO_TELEMETRY=1 keeps the launcher
  # quiet and offline-stable.
  bend-proof:
    runs-on: ubuntu-latest
    env:
      BEND_NO_TELEMETRY: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Bend
        run: curl -fsSL https://bend-lang.com/install.sh | sh

      - name: Run proof (expect 300n)
        run: |
          export PATH="$HOME/.bend/bin:$PATH"
          command -v bend
          bend native/bend/PROOF.bend | tee /tmp/bend-proof.out
          grep -q 300n /tmp/bend-proof.out
