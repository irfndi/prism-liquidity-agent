version: 2
updates:
  # The root is a Bun project (bun.lock). Declaring it as `npm_and_yarn` made
  # EVERY update run fail with `misconfigured_tooling: … Dependabot's
  # npm_and_yarn ecosystem cannot update bun.lock` — which is why the 2026-08-31
  # batch (#225-#229) was never rebased and sat unmergeable for three months.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Three dependency clusters break each other silently when one side moves
    # alone, and `bun run check:toolchain` (verify step 0, before lint) fails the
    # build when they drift. Dependabot cannot express that coupling, so a
    # single-package bump for these always lands red. Grouping gives one PR per
    # cluster that can actually go green; `ignore` covers the members that must
    # not move at all.
    groups:
      effect-toolchain:
        # @effect/tsgo publishes a support table for Oxlint/tsgolint/TypeScript,
        # and the anti-slop Oxlint plugins inline @oxlint/plugins at bundle
        # time, so a stale bundle silently loads a mismatched shim.
        patterns:
          - "effect"
          - "@effect/tsgo"
          - "oxlint"
          - "oxlint-tsgolint"
          - "oxfmt"
          - "@oxlint/plugins"
          - "typescript"
      solana-sdk:
        patterns:
          - "@solana/spl-token"
          - "@meteora-ag/dlmm"
      dev-tooling:
        patterns:
          - "tsdown"
          - "@types/*"
          - "vitest"
          - "@vitest/*"
          - "fast-check"
    ignore:
      # @meteora-ag/dlmm 1.9.14 declares these as EXACT deps (anchor 0.31.0,
      # web3.js ^1.91.6). A "latest" bump compiles the adapter against a
      # different SDK than the one it calls — a silent ABI/IDL mismatch at
      # transaction-build time, not a type error. Re-evaluate only when dlmm
      # moves its own peer; check:toolchain reports the moment it does.
      - dependency-name: "@coral-xyz/anchor"
      - dependency-name: "@coral-xyz/borsh"
      - dependency-name: "@solana/web3.js"
        update-types:
          - "version-update:semver-major"

  # Cloudflare subproject: separate bun.lock, separate manifest.
  - package-ecosystem: "bun"
    directory: "/cloudflare"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"

  # `mcp-server` is the one npm subproject, but its lockfile is gitignored, so
  # Dependabot has nothing to update there. It is upgraded by hand with the
  # rest of the toolchain.

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
