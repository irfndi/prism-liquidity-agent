[package]
name = "prismd"
version = "0.1.0"
edition = "2021"

[dependencies]
# rustls pinned to the `ring` provider, NOT the default aws-lc-rs: aws-lc-sys
# needs cmake + nasm + clang at build time and none of the three prismd build
# jobs (ci.yml rust-host/prismd-ci-build, release.yml artifacts) install them.
# `ring` builds with cc only. Verified: `grep -c aws-lc-sys Cargo.lock` == 0.
# reqwest 0.13 has no `rustls-ring` or `rustls-tls-webpki-roots-no-provider`
# feature (removed with the aws-lc-rs default), so `rustls-no-provider` +
# the explicit rustls/ring deps below pin the provider.
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls-no-provider",
    "json",
    "blocking",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# base64 is ALREADY in the lock transitively (reqwest tree) — declared direct
# for `getAccountInfo` account decoding; adds zero new crates to the build.
base64 = "0.22"
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "float_roundtrip"] }
