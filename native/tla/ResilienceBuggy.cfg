\* Buggy resilience policy: the breaker is wired without its `isRetriable`
\* predicate, so every error strikes, including a caller-side one.
\*
\* Expected TLC result: LocalErrorDoesNotStrike is VIOLATED with the
\* counterexample (kind = "local", strikes >= Threshold - 1) — the breaker then
\* rejects every later call, including a capital-protecting EXIT.
SPECIFICATION Spec

CONSTANT StrikeLocalErrors = TRUE
CONSTANT Threshold = 3
CONSTANT MaxRetries = 3

INVARIANT TypeInvariant
INVARIANT OpenRejectsWithoutCall
INVARIANT HalfOpenSingleProbe
INVARIANT RejectedNeverOpens
INVARIANT RetryOnlyRetriable
INVARIANT RetryBounded
INVARIANT LocalErrorDoesNotStrike
