\* Buggy resilience policy: the breaker is wired without its `isRetriable`
\* predicate, so a provider rejecting the REQUEST (400, bad parameter,
\* validation) strikes the endpoint as if it were dead.
\*
\* Expected TLC result: BusinessErrorDoesNotOpen is VIOLATED with the
\* counterexample (kind = "business", strikes >= Threshold - 1) — the breaker
\* then rejects every later call, including a capital-protecting EXIT.
SPECIFICATION Spec

CONSTANT StrikeBusinessErrors = TRUE
CONSTANT Threshold = 3
CONSTANT MaxRetries = 3

INVARIANT TypeInvariant
INVARIANT OpenRejectsWithoutCall
INVARIANT HalfOpenSingleProbe
INVARIANT RetryOnlyTransient
INVARIANT RetryBounded
INVARIANT BusinessErrorDoesNotOpen
