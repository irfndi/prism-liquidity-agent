\* Fixed resilience policy, matching the runtime's two classifiers:
\* `isRpcNetworkError` strikes on rate limits, HTTP 4xx/5xx and transport
\* failures; `isRetriableError` retries the rate-limited class only. A
\* caller-side error (validation, a bad argument) strikes nothing.
\*
\* Every invariant must hold.
SPECIFICATION Spec

CONSTANT StrikeLocalErrors = FALSE
CONSTANT Threshold = 3
CONSTANT MaxRetries = 3

INVARIANT TypeInvariant
INVARIANT OpenRejectsWithoutCall
INVARIANT HalfOpenSingleProbe
INVARIANT RejectedNeverOpens
INVARIANT RetryNeverOpens
INVARIANT RetryOnlyRetriable
INVARIANT RetryBounded
INVARIANT LocalErrorDoesNotStrike
