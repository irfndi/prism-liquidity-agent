\* Fixed resilience policy: only transient transport errors strike the breaker,
\* retries are bounded at 3, and the breaker opens after 3 consecutive strikes.
\* Every invariant must hold.
SPECIFICATION Spec

CONSTANT StrikeBusinessErrors = FALSE
CONSTANT Threshold = 3
CONSTANT MaxRetries = 3

INVARIANT TypeInvariant
INVARIANT OpenRejectsWithoutCall
INVARIANT HalfOpenSingleProbe
INVARIANT RejectedNeverOpens
INVARIANT RetryOnlyTransient
INVARIANT RetryBounded
INVARIANT BusinessErrorDoesNotOpen
