\* Fixed policy: hold-bias is on (never exit economically on positive carry)
\* and rotation needs a 3x net edge. Every invariant must hold.
SPECIFICATION Spec

CONSTANT RespectCarry = TRUE
CONSTANT RotationMult = 3

INVARIANT TypeInvariant
INVARIANT SafetyPrecedence
INVARIANT NoEconomicExitOnPositiveCarry
INVARIANT EconomicExitNeedsMaturity
INVARIANT NeverRotateOutOfPositiveCarry
INVARIANT RotationOnlyIfMateriallyBetter
