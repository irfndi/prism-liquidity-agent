\* Buggy build (the pre-#237 behavior): the TA path fires on the price
\* confluence alone, ignoring the position's projected P&L. A losing position
\* with no measured fee/IL is closed by TA, violating NoLossTaClose.
\*
\* Expected TLC result: NoLossTaClose is VIOLATED. That counterexample is the
\* regression the model is written to detect.
SPECIFICATION Spec

CONSTANT MaxAge = 5
CONSTANT HoldFloor = 2
CONSTANT TaPresent = TRUE
CONSTANT Nonnegative = FALSE
CONSTANT FeeIlRatioKnown = FALSE
CONSTANT FeeIlRatio = 0
CONSTANT MinFeeIlRatio = 120
CONSTANT HonestGate = FALSE
CONSTANT HonestHold = TRUE
CONSTANT OtherExits = TRUE

INVARIANT TypeInvariant
INVARIANT NoImmatureTaClose
INVARIANT NoLossTaClose
